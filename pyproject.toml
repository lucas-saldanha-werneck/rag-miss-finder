[project]
name = "rag-miss-finder"
version = "0.1.0"
description = "Find out why a keyword retriever misses: vocabulary gap or bad ranking"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
rag-miss-finder = "rag_miss_finder.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_miss_finder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
